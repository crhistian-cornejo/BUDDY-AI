name: Buddy
options:
  bundleIdPrefix: io.github.crhistian-cornejo
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # buddy-core: the static library and the UniFFI module the pre-build phase writes to Generated/.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/include
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/Generated
    OTHER_LDFLAGS: -lbuddy_core
  configs:
    Debug:
      # Local development builds are not signed.
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      # Ad-hoc by default; the Developer ID identity is set when the first distributable build is made (phase 8).
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "-"

schemes:
  Buddy:
    build:
      targets:
        Buddy: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [BuddyTests]
    archive:
      config: Release

targets:
  Buddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
      # Generated by the pre-build phase; listed so the project knows it before the first build.
      - path: Generated/BuddyCore.swift
        optional: true
      - path: ../../assets/design-tokens.json
        buildPhase: resources
      # The accent (mint) and indigo of the palette, with light and dark shades.
      - path: Resources/Assets.xcassets
    preBuildScripts:
      - name: buddy-core (Rust + UniFFI)
        shell: /bin/bash
        script: '/bin/bash "${SRCROOT}/../../scripts/build-core-macos.sh"'
        # cargo is incremental: let it decide what to rebuild every time.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/BuddyCore.swift
          - $(SRCROOT)/Generated/libbuddy_core.a
    postBuildScripts:
      - name: buddy-hook (relay)
        shell: /bin/bash
        script: |
          set -e
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          cp "${SRCROOT}/Generated/buddy-hook" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/buddy-hook"
          # Signed with the app's identity before Xcode signs the bundle (Release); Debug stays unsigned.
          if [ "${CODE_SIGNING_ALLOWED}" = "YES" ]; then
            codesign --force --options runtime --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/buddy-hook"
          fi
        inputFiles:
          - $(SRCROOT)/Generated/buddy-hook
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/buddy-hook
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Buddy
        CFBundleDisplayName: Buddy
        CFBundleIdentifier: io.github.crhistian-cornejo.buddy
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: es
        LSUIElement: YES
        NSAppleEventsUsageDescription: "Buddy pregunta a Spotify o Música qué suena y usa sus botones de anterior, pausa y siguiente en el notch. No toca nada más."
        NSHighResolutionCapable: YES
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.crhistian-cornejo.buddy
        PRODUCT_NAME: Buddy
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Buddy.entitlements
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The pre-build phase runs cargo over the whole repository and ~/.cargo.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  BuddyTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - target: Buddy
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.crhistian-cornejo.buddy.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Buddy.app/Contents/MacOS/Buddy
        BUNDLE_LOADER: $(TEST_HOST)
