<!doctype html>
<!-- Development only (not built): the Windows Settings window with a fake Tauri bridge, to check its look in a browser.
     Open http://localhost:1420/preview/settings.html (npm run dev); ?empty shows every list empty. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ajustes de Buddy</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/settings/settings.css" />
    <style>html, body.settings { width: 680px; height: 520px; outline: 1px solid #8884; }</style>
    <script>
      const handlers = {};
      let next = 1;
      const empty = new URLSearchParams(location.search).has("empty");
      const now = Date.now() / 1000;
      const flags = { "pet.wander": true, "router.cheap": true, "commands.enabled": false, "briefing.enabled": true };
      let folders = empty ? [] : [
        { path: "C:\\Users\\corx\\Documents\\Proyectos", canEdit: true },
        { path: "C:\\Users\\corx\\OneDrive\\Escritorio\\Universidad\\Ciclo 2026-II\\Cálculo multivariable", canEdit: false },
        { path: "D:\\Fotos", canEdit: false },
      ];
      const hooks = [
        { agent: "claude", name: "Claude Code", installed: true, available: true, relayReady: true },
        { agent: "codex", name: "Codex", installed: false, available: true, relayReady: true },
      ];
      let topics = "noticias de tecnología; Apple; fútbol peruano; el tiempo en Lima";
      // ?telegram=pairing | paired shows those states (default: not connected).
      const tgMode = new URLSearchParams(location.search).get("telegram") ?? "";
      let telegram = { connected: tgMode !== "", paired: tgMode === "paired", botName: tgMode ? "@mi_buddy_bot" : "", pairingCode: tgMode === "pairing" ? "482913" : "", error: "" };
      const connectors = [
        { id: "context7", name: "Context7", description: "Documentación al día de librerías y APIs de programación.", site: "https://context7.com", enabled: true, hasKey: false, keyOptional: true },
        { id: "mslearn", name: "Microsoft Learn", description: "Documentación oficial de Microsoft: Windows, Office, Azure, .NET, PowerShell.", site: "https://learn.microsoft.com/training/support/mcp", enabled: false, hasKey: false, keyOptional: false },
        { id: "deepwiki", name: "DeepWiki", description: "Explica cualquier repositorio público de GitHub y responde preguntas sobre él.", site: "https://deepwiki.com", enabled: false, hasKey: false, keyOptional: false },
      ];
      const fake = {
        setting_flag: ({ key }) => flags[key],
        set_setting_flag: ({ key, on }) => { flags[key] = on; },
        folders: () => folders,
        pick_folder: () => (folders = [...folders, { path: "C:\\Users\\corx\\Downloads", canEdit: false }]),
        set_folder_edit: ({ path, canEdit }) => (folders = folders.map((f) => (f.path === path ? { ...f, canEdit } : f))),
        remove_folder: ({ path }) => (folders = folders.filter((f) => f.path !== path)),
        hooks_status: () => hooks,
        telegram_status: () => telegram,
        telegram_connect: ({ token }) => {
          if (!/^\d+:[\w-]{30,}$/.test(token.trim())) throw "Ese no parece un token de bot. Cópialo completo de @BotFather (números, dos puntos y letras).";
          telegram = { connected: true, paired: false, botName: "@mi_buddy_bot", pairingCode: "482913", error: "" };
        },
        telegram_disconnect: () => { telegram = { connected: false, paired: false, botName: "", pairingCode: "", error: "" }; },
        telegram_new_pairing_code: () => { telegram = { ...telegram, paired: false, pairingCode: "730154" }; return "730154"; },
        telegram_send: () => {},
        connectors: () => connectors.map((c) => ({ ...c })),
        set_connector_enabled: ({ id, on }) => { connectors.find((c) => c.id === id).enabled = on; },
        set_connector_key: ({ id, key }) => { connectors.find((c) => c.id === id).hasKey = key.trim() !== ""; },
        hooks_preview: ({ agent, install }) => ({
          path: agent === "codex" ? "C:\\Users\\corx\\.codex\\hooks.json" : "C:\\Users\\corx\\.claude\\settings.json",
          fingerprint: "abc",
          diff: install
            ? '   "hooks": {\n+    "Stop": [{ "hooks": [{ "type": "command", "command": "\\"C:/Users/corx/AppData/Local/Buddy/bin/buddy-hook.exe\\" Stop" }] }],\n+    "PermissionRequest": [{ "hooks": [{ "type": "command", "command": "\\"C:/Users/corx/AppData/Local/Buddy/bin/buddy-hook.exe\\" PermissionRequest" }] }],\n   "model": "opus"'
            : '   "hooks": {\n-    "Stop": [{ "hooks": [{ "type": "command", "command": "\\"buddy-hook.exe\\" Stop" }] }],\n   }',
        }),
        hooks_write: ({ agent, install }) => { hooks.find((h) => h.agent === agent).installed = install; return "C:\\Users\\corx\\.claude\\settings.json.buddy-2026-10-02.bak"; },
        usage: () => empty ? [] : [
          { provider: "claude", name: "Claude", windows: [{ label: "5 h", usedPct: 56, resetsAt: now + 7200 }, { label: "semana", usedPct: 74, resetsAt: now + 86400 * 3 }, { label: "semana · Opus", usedPct: 93, resetsAt: null }] },
          { provider: "codex", name: "Codex", windows: [{ label: "semana", usedPct: 6, resetsAt: null }] },
        ],
        token_report: () => empty ? [] : [
          { feature: "chat", provider: "claude", turns: 42, input: 812000, output: 64300, cached: 1450000, costUsd: 3.21 },
          { feature: "mensajitos", provider: "claude", turns: 9, input: 18200, output: 2100, cached: 0, costUsd: 0.04 },
          { feature: "código", provider: "codex", turns: 5, input: 950, output: 310, cached: 0, costUsd: 0 },
        ],
        agents: () => [
          { id: "buddy", name: "Buddy", specialty: "Habla contigo y reparte el trabajo.", provider: "claude", model: "sonnet", permissions: ["web", "leer", "editar", "comandos", "documentos", "musica"] },
          { id: "investigador", name: "Investigador", specialty: "Busca en la web y resume con fuentes.", provider: "claude", model: "auto", permissions: ["web", "documentos"] },
          { id: "programador", name: "Programador", specialty: "Escribe y revisa código en tus carpetas.", provider: "codex", model: "codex:gpt-6.1-sol", permissions: ["leer", "editar", "comandos"] },
        ],
        // Faces: agent-looks.json holds the core's idle face grids (written by core's look::tests::preview_sheets).
        look_options: () => ({
          colors: [["menta", "Menta", "#86DDB8"], ["cielo", "Cielo", "#8CC8F2"], ["lavanda", "Lavanda", "#B9A5F0"], ["rosa", "Rosa", "#F4A6CB"],
            ["fresa", "Fresa", "#F28A8C"], ["mandarina", "Mandarina", "#F6B26E"], ["limon", "Limón", "#EBD86A"], ["grafito", "Grafito", "#A8B0BC"]]
            .map(([id, label, hex]) => ({ id, label, hex })),
          accessories: [["ninguno", "Ninguno"], ["gorra", "Gorra"], ["lentes", "Lentes"], ["audifonos", "Audífonos"], ["corona", "Corona"],
            ["bandana", "Bandana"], ["gorro", "Gorro de lana"]].map(([id, label]) => ({ id, label, hex: null })),
          eyes: [["normales", "Normales"], ["felices", "Felices"], ["serios", "Serios"], ["guino", "Guiño"]].map(([id, label]) => ({ id, label, hex: null })),
        }),
        agent_look: ({ agentId }) => ({ ...(looks[agentId] ?? { color: "rosa", accessory: "ninguno", eyes: "normales", badge: null }) }),
        set_agent_look: ({ agentId, look }) => { looks[agentId] = look; },
        reset_agent_look: ({ agentId }) => { looks[agentId] = { ...defaultLooks[agentId] }; },
        agent_sprite: ({ agentId }) => lookSprite(fake.agent_look({ agentId })),
        look_preview: ({ look }) => lookSprite(look),
        sprite: () => lookSprite(defaultLooks.buddy),
        agent_permission_catalog: () => [
          { id: "web", name: "Web", detail: "Buscar y leer páginas" }, { id: "leer", name: "Leer carpetas", detail: "" },
          { id: "editar", name: "Editar carpetas", detail: "" }, { id: "comandos", name: "Comandos", detail: "" },
          { id: "documentos", name: "Documentos", detail: "" }, { id: "musica", name: "Música", detail: "" }],
        router_config: () => ({ mode: "auto", models: [
            { id: "claude:haiku", name: "Haiku 4.5", provider: "claude" }, { id: "claude:sonnet", name: "Sonnet 5.5", provider: "claude" },
            { id: "claude:opus", name: "Opus 5.5", provider: "claude" }, { id: "codex:gpt-6.1-sol", name: "GPT-6.1 Sol", provider: "codex" },
            { id: "codex:gpt-6-luna", name: "GPT-6 Luna", provider: "codex" }],
          tiers: [{ tier: "light", label: "Ligero", model: "claude:haiku", effort: "low" }, { tier: "normal", label: "Normal", model: "claude:sonnet", effort: "medium" },
            { tier: "deep", label: "A fondo", model: "claude:opus", effort: "high" }, { tier: "code", label: "Código", model: "codex:gpt-6.1-sol", effort: "medium" }] }),
        router_preview: ({ text }) => `A fondo → Opus 5.5 (alto) · pide análisis`,
        briefing_topics: () => topics,
        set_briefing_topics: ({ topics: t }) => (topics = t.trim() || "noticias de tecnología; Apple; fútbol peruano; el tiempo en Lima"),
        briefing: () => empty ? [] : [
          { topic: "Apple", text: "Apple prepara hasta 7 productos para octubre: iPad mini OLED, iMac y MacBook Pro con M6.", url: "https://example.com/a", at: now },
          { topic: "fútbol", text: "Universitario gana 2-1 en el Monumental con gol en el 88'.", url: "https://example.com/b", at: now },
          { topic: "tecnología", text: "Claude Code añade agentes en segundo plano para tareas largas.", url: null, at: now },
        ],
      };
      const defaultLooks = {
        buddy: { color: "menta", accessory: "ninguno", eyes: "normales", badge: null },
        investigador: { color: "lavanda", accessory: "lentes", eyes: "normales", badge: null },
        programador: { color: "grafito", accessory: "audifonos", eyes: "serios", badge: "cielo" },
      };
      const looks = JSON.parse(JSON.stringify(defaultLooks));
      const lookData = fetch("/preview/agent-looks.json").then((r) => r.json());
      async function lookSprite(look) {
        const d = await lookData;
        const pal = { ...d.palette };
        d.ramps[look.color].forEach((hex, i) => (pal["odBbl"[i]] = hex));
        const auto = d.accessoryColors[look.accessory] ?? ["fresa"];
        const accent = look.badge ?? auto.find((c) => c !== look.color) ?? auto[0];
        d.ramps[accent].forEach((hex, i) => (pal["OQqaA"[i]] = hex));
        const grid = d.grids[`${look.accessory}/${look.eyes}`];
        const pixels = grid.flatMap((row) => [...row].map((ch) => (pal[ch] ? (0xff000000 | parseInt(pal[ch].slice(1), 16)) >>> 0 : 0)));
        return { id: "look", name: "", size: grid.length, face: { x: 0, y: 0, size: grid.length }, states: [{ name: "idle", fps: 1, frames: [pixels] }] };
      }
      window.__TAURI_INTERNALS__ = {
        metadata: { currentWindow: { label: "settings" }, currentWebview: { windowLabel: "settings", label: "settings" } },
        transformCallback: (cb) => { const id = next++; handlers[id] = cb; return id; },
        unregisterCallback: () => {},
        invoke: async (cmd, args) => (fake[cmd] ? fake[cmd](args ?? {}) : null),
      };
    </script>
  </head>
  <body class="settings">
    <nav id="tabs" role="tablist" aria-label="Ajustes" aria-orientation="vertical"></nav>
    <main id="page" role="tabpanel"></main>
    <script type="module" src="/src/settings/main.ts"></script>
  </body>
</html>
