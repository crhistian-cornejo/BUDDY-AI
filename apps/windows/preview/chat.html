<!doctype html>
<!-- Development only (not built): the Windows chat page with a fake Tauri bridge, to check its look in a browser. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/chat/chat.css" />
    <style>html, body { background: #888 !important; } #root { width: 440px; margin: 40px; }</style>
    <script>
      const handlers = {};
      const listeners = {};
      const hold = new URLSearchParams(location.search).has("hold");
      let next = 1;
      const emit = (payload) => Object.values(listeners).filter((l) => l.event === "core-event").forEach((l) => handlers[l.handler]?.({ event: "core-event", id: 0, payload }));
      window.__TAURI_INTERNALS__ = {
        metadata: { currentWindow: { label: "chat" }, currentWebview: { windowLabel: "chat", label: "chat" } },
        transformCallback: (cb) => { const id = next++; handlers[id] = cb; return id; },
        unregisterCallback: () => {},
        invoke: async (cmd, args) => {
          if (cmd === "plugin:event|listen") { const id = next++; listeners[id] = args; return id; }
          if (cmd === "plugin:event|unlisten") { delete listeners[args.eventId]; return; }
          if (cmd === "queued_messages" || cmd === "messages") return [];
          if (cmd === "cancel_chat") { emit({ type: "chatDone", chatId: "c1", messageId: 0 }); return; }
          if (cmd === "agent_sprite") {
            const d = await fetch("/preview/agent-looks.json").then((r) => r.json());
            const parley = args.agentId === "parley";
            const pal = { ...d.palette };
            d.ramps[parley ? "cielo" : "menta"].forEach((hex, i) => (pal["odBbl"[i]] = hex));
            d.ramps.fresa.forEach((hex, i) => (pal["OQqaA"[i]] = hex));
            const grid = d.grids[(parley ? "gorra" : "ninguno") + "/normales"];
            const pixels = grid.flatMap((row) => [...row].map((ch) => pal[ch] ? (0xff000000 | parseInt(pal[ch].slice(1), 16)) >>> 0 : 0));
            return { size: grid.length, face: { x: 0, y: 0, size: grid.length }, states: [{ name: "idle", frames: [pixels] }] };
          }
          if (cmd === "send_message") {
            const c = "c1", s = (t, d) => setTimeout(() => emit(d), t);
            s(0, { type: "chatDequeued", chatId: c, text: args.text, attachments: [] });
            s(400, { type: "chatStarted", chatId: c, agent: "buddy", agentName: "Buddy", provider: "claude" });
            s(1200, { type: "chatStarted", chatId: c, agent: "parley", agentName: "PARLEY", provider: "claude" });
            s(2000, { type: "chatTool", chatId: c, name: "WebSearch", summary: "Real Madrid próximo partido" });
            if (hold) return c;
            s(3200, { type: "chatSource", chatId: c, title: "Marca", url: "https://www.marca.com/futbol/real-madrid.html" });
            s(3300, { type: "chatDelta", chatId: c, text: "**Real Madrid** llega en buena forma:\n\n| Partido | Resultado |\n|---|---|\n| vs Getafe | 2-0 |\n| vs Betis | 1-1 |\n\nConfianza: *media*." });
            s(4000, { type: "chatDone", chatId: c, messageId: 2 });
            return c;
          }
          if (cmd === "chats") return [{ id: "c1", title: "¿Cómo llega el Madrid?", updatedAt: 0, preview: "" }];
          if (cmd === "agents") return [{ id: "buddy", name: "Buddy" }, { id: "parley", name: "PARLEY" }];
          return null;
        },
      };
    </script>
  </head>
  <body class="chat">
    <div id="root">
      <section id="panel" class="card" hidden>
        <header>
          <h1 id="title">Buddy</h1>
          <button id="new" class="ghost" type="button" title="Nuevo chat (Ctrl+N)" aria-label="Nuevo chat"></button>
          <button id="history" class="ghost" type="button" title="Buscar en el historial (Ctrl+F)" aria-label="Buscar en el historial"></button>
          <button id="close" class="ghost" type="button" title="Cerrar (Esc)" aria-label="Cerrar"></button>
        </header>
        <div id="messages" role="log" aria-live="polite"></div>
      </section>
      <div id="composer-stack">
        <div id="queue" aria-label="Mensajes en cola" hidden></div>
      <form id="composer" class="card" autocomplete="off">
        <div id="queue-error" role="status" hidden></div>
        <div id="files" hidden></div>
        <button type="button" id="attach" class="ghost" title="Adjuntar archivos (imágenes, PDF, texto)" aria-label="Adjuntar archivos"></button>
        <textarea id="input" rows="1" placeholder="Pregúntale a Buddy" aria-label="Mensaje para Buddy"></textarea>
        <button type="button" id="stop" class="ghost" hidden title="Detener y vaciar la cola" aria-label="Detener y vaciar la cola"></button>
        <button type="submit" id="send" class="primary" title="Enviar (Enter)" aria-label="Enviar"></button>
      </form>
      </div>
    </div>
    <script type="module" src="/src/chat/main.ts"></script>
  </body>
</html>
