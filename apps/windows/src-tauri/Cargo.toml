[package]
name = "buddy"
description = "Buddy for Windows: the pixel mascot and the top bar, on top of buddy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
buddy-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# macos-private-api only lets the window be transparent when the app is run on a Mac during development.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
