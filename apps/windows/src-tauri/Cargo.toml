[package]
name = "buddy"
description = "Buddy for Windows: the pixel mascot and the top bar, on top of buddy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
buddy-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# macos-private-api only lets the window be transparent when the app is run on a Mac during development.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
arboard = { version = "3.6", default-features = false }

[target.'cfg(windows)'.dependencies]
# GetLastInputInfo (seconds since the last input, for "Buddy sleeps when you are away"). A query, not a hook.
windows = { version = "0.61", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
  # Media control (media.rs): Windows' own "now playing" sessions; no network.
  "Foundation",
  "Graphics_Imaging",
  "Media_Control",
  "Storage_Streams",
  "Win32_System_Com",
  "Win32_System_Power",
  # Screenshots for agents (capture.rs), only after the user's click.
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
