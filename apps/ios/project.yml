name: BuddyiOS
options:
  bundleIdPrefix: io.github.crhistian-cornejo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # buddy-remote: the static library and the UniFFI module the pre-build phase writes to Generated/.
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/include
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/Generated
    OTHER_LDFLAGS: -lbuddy_remote

targets:
  Buddy:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
      # Generated by the pre-build phase; listed so the project knows it before the first build.
      - path: Generated/BuddyRemote.swift
        optional: true
      - path: Resources/Assets.xcassets
    preBuildScripts:
      - name: buddy-remote (Rust + UniFFI)
        shell: /bin/bash
        script: '/bin/bash "${SRCROOT}/../../scripts/build-remote-ios.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/BuddyRemote.swift
          - $(SRCROOT)/Generated/libbuddy_remote.a
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Buddy
        CFBundleDisplayName: Buddy
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        CFBundleDevelopmentRegion: es
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # buddy://pair?d=… : the link behind the pairing QR.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.crhistian-cornejo.buddy.pair
            CFBundleURLSchemes: [buddy]
        NSCameraUsageDescription: "Buddy usa la cámara solo para leer el código QR que empareja este iPhone con tu Mac o tu PC."
        NSFaceIDUsageDescription: "Buddy pide Face ID para abrir la app y antes de permitir lo que un agente quiere hacer en tu equipo."
        # A relay under test on this Mac (http://127.0.0.1) is reached in the clear; nothing else is.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.crhistian-cornejo.buddy.ios
        PRODUCT_NAME: Buddy
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The pre-build phase runs cargo over the whole repository and ~/.cargo.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
