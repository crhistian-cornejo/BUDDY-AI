[workspace]
resolver = "3"
members = ["telegram", "core", "core/uniffi-bindgen", "hook", "apps/windows/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Buddy contributors"]

[workspace.dependencies]
buddy-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.32"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
