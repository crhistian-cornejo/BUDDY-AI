[package]
name = "buddy-core"
description = "Buddy's shared core: providers, orchestrator, store, events and the pixel characters"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "buddy_core"
# The Mac app links a static library built with `cargo rustc --crate-type staticlib --features ffi`
# (scripts/build-core-macos.sh); the Windows app uses the crate directly.

[features]
# Swift bindings through UniFFI (Mac). Off for the Windows app, which calls Rust directly.
ffi = ["dep:uniffi"]

[dependencies]
# Sanitizes browser context URLs without forwarding credentials, query tokens or fragments.
url = "2"
buddy-telegram = { path = "../telegram" }
buddy-remote = { path = "../remote" }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
uniffi = { workspace = true, optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.23.1"
ureq = "3"
# Niko's mail watch (mailwatch.rs): TLS to imap.gmail.com with the bundled web roots.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
ical = { version = "0.11", default-features = false, features = ["ical"] }
chrono-tz = "0.10"
rrule = "0.14"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
qrcode = { version = "0.14.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The hooks pipe (sessions/server.rs): an owner-only named pipe, and who is on the other end of it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
