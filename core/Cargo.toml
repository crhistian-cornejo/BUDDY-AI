[package]
name = "buddy-core"
description = "Buddy's shared core: providers, orchestrator, store, events and the pixel characters"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "buddy_core"
# The Mac app links a static library built with `cargo rustc --crate-type staticlib --features ffi`
# (scripts/build-core-macos.sh); the Windows app uses the crate directly.

[features]
# Swift bindings through UniFFI (Mac). Off for the Windows app, which calls Rust directly.
ffi = ["dep:uniffi"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
uniffi = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The hooks pipe (sessions/server.rs): an owner-only named pipe, and who is on the other end of it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
