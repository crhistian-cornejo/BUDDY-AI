[package]
name = "mika"
description = "MIKA for Windows — Mika lives at the top of your screen"
authors = ["MIKA contributors"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mika_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "process"] }
# rustls-tls-native-roots: also trust the certificates Windows trusts. Behind a company proxy that inspects HTTPS
# (re-signing with its own root), the built-in roots alone refuse every site; browsers and the claude CLI use the
# system store too.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  # Media control (services/media.rs): Windows' own "now playing" sessions; no network.
  "Foundation",
  "Graphics_Imaging",
  "Media_Control",
  "Storage_Streams",
  # Volume and mute of the playing app (services/volume.rs): its own audio session, never the master volume.
  "Win32_Media_Audio",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Ole",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_Storage_FileSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
