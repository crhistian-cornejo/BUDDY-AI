[package]
name = "mika-telegram"
description = "MIKA's read-only window on the user's own Telegram account (MTProto through grammers)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mika_telegram"
path = "src/lib.rs"

[[bin]]
name = "mika-telegram"
path = "src/main.rs"

# grammers is the only way to read the channels a user belongs to: the Bot API
# can only read channels where the bot is an admin, and MTProto by hand is not
# realistic. It is pure Rust (no C, no DLL), so nothing extra lands on disk.
# grammers-session's default SQLite storage stays off: the session lives in the
# OS vault, passed in and out by MIKA.
[dependencies]
grammers-client = "0.10"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "time", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
